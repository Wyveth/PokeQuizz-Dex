server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers générés avec une empreinte dans le nom : cache long
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Configuration lue au démarrage de l'application : jamais en cache
    location /assets/env/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Application monopage : toute autre route renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

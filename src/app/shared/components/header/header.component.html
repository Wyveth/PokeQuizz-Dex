<header class="sticky top-0 z-50 px-3 sm:px-6 pt-3">
  <nav class="glass mx-auto max-w-6xl h-16 rounded-2xl px-2 sm:px-3 flex items-center gap-1 sm:gap-2">
    <a
      [routerLink]="['/', loc, 'pokedex']"
      class="flex items-center gap-2.5 pl-1 pr-2 sm:pr-3 h-11 rounded-xl"
      aria-label="Accueil PokeQuizz Dex"
    >
      <span
        class="grid place-items-center size-9 rounded-xl bg-gradient-to-br from-brand-400 to-brand-700 text-white font-display font-extrabold text-sm shadow-md shadow-brand-500/30"
        >PQ</span
      >
      <span class="hidden sm:block font-display font-bold text-lg tracking-tight">
        PokeQuizz<span class="text-brand-500">Dex</span>
      </span>
    </a>

    <div class="flex items-center gap-1 ml-1 sm:ml-3">
      <a
        [routerLink]="['/', loc, 'pokedex']"
        routerLinkActive="is-active"
        class="nav-link"
        title="Pokédex"
      >
        <i class="pi pi-th-large text-sm"></i><span class="hidden md:inline">Pokédex</span>
      </a>
      <a
        [routerLink]="['/', loc, 'quiz']"
        routerLinkActive="is-active"
        class="nav-link"
        title="Quiz"
      >
        <i class="pi pi-question-circle text-sm"></i><span class="hidden md:inline">Quiz</span>
      </a>
    </div>

    <div class="ml-auto flex items-center gap-1">
      <app-language></app-language>
      <app-theme-switch></app-theme-switch>
      <a
        [routerLink]="['/', loc, 'login']"
        routerLinkActive="is-active"
        class="icon-btn"
        title="Connexion"
        aria-label="Connexion"
      >
        <i class="pi pi-user"></i>
      </a>
    </div>
  </nav>
</header>

<button
  type="button"
  (click)="nextTheme()"
  class="icon-btn relative overflow-hidden"
  [title]="labels[current]"
  [attr.aria-label]="'Thème : ' + labels[current]"
>
  @for (opt of options; track opt) {
    <i
      class="pi absolute transition-all duration-300 ease-out"
      [ngClass]="icons[opt]"
      [class.opacity-0]="current !== opt"
      [class.scale-50]="current !== opt"
      [class.-rotate-90]="current !== opt"
      [class.opacity-100]="current === opt"
    ></i>
  }
</button>

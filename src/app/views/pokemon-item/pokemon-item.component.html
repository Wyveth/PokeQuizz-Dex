<a
  (click)="goToPokemonDetails(pokemon.id)"
  (keydown.enter)="goToPokemonDetails(pokemon.id)"
  tabindex="0"
  role="link"
  [attr.aria-label]="pokemon.dataInfo.name"
  class="card card-interactive group flex flex-col h-full p-3 sm:p-4"
>
  <span class="absolute top-3 left-3.5 text-xs font-semibold tabular-nums text-muted">
    #{{ pokemon.number }}
  </span>

  <div class="relative h-28 sm:h-32 mt-3 flex items-center justify-center">
    <div
      class="absolute size-24 sm:size-28 rounded-full bg-gradient-to-b from-white to-white/0 dark:from-white/10 dark:to-transparent transition-transform duration-500 group-hover:scale-110"
    ></div>
    <img
      [src]="imgRoot + pokemon.pathAnimatedImg"
      [alt]="pokemon.dataInfo.name"
      loading="lazy"
      class="relative max-h-full max-w-full object-contain drop-shadow-md transition-transform duration-300 group-hover:scale-110"
    />
  </div>

  <h2 class="mt-3 font-display font-semibold text-base sm:text-lg text-center truncate">
    {{ pokemon.dataInfo.name }}
  </h2>

  <div class="mt-2 flex flex-wrap justify-center gap-1.5">
    @for (typePok of pokemon.typePoks; track $index) {
      <img class="h-5 sm:h-6 w-auto" [src]="imgRoot + typePok.pathMiniHome" [alt]="typePok.name" />
    }
  </div>
</a>

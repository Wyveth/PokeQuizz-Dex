<section class="mx-auto max-w-6xl px-3 sm:px-6 pt-8 sm:pt-12">
  <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brand-600 dark:text-brand-400">Quiz</p>
  <h1 class="font-display text-4xl sm:text-5xl font-bold tracking-tight mt-1 mb-8">Choisissez un jeu</h1>

  @if (!games) {
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (i of [1, 2, 3]; track i) {
        <div class="card skeleton h-24"></div>
      }
    </div>
  } @else {
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (game of games; track $index) {
        <div class="card card-interactive p-5 flex items-center gap-4">
          <span class="grid place-items-center size-11 rounded-xl bg-brand-50 text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">
            <i class="pi pi-play"></i>
          </span>
          <span class="font-display font-semibold">{{ game.name || game['Name'] }}</span>
          <i class="pi pi-chevron-right text-xs text-muted ml-auto"></i>
        </div>
      } @empty {
        <p class="text-muted">Aucun jeu disponible pour le moment.</p>
      }
    </div>
  }
</section>

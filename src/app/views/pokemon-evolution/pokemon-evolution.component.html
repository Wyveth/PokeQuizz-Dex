@if (forms.listForm.length > 0) {
  <div>
    <p class="text-xs font-semibold uppercase tracking-wider text-muted mb-2 sm:mb-3">{{ title }}</p>
    <!-- Mobile : 3 cartes compactes par ligne -->
    <div class="grid grid-cols-3 gap-2 sm:flex sm:flex-wrap sm:gap-3">
      @for (pok of forms.listForm; track $index) {
        <button
          type="button"
          (click)="navigateTo(pok.id)"
          class="card card-interactive min-w-0 sm:w-40 p-2 sm:p-3 flex flex-col items-center text-center"
        >
          @if (pok.number) {
            <span class="self-start text-[0.6rem] sm:text-[0.7rem] font-semibold tabular-nums text-muted">#{{ pok.number }}</span>
          }
          <img
            [src]="imgRoot + pok.pathImgNormal"
            [alt]="pok.dataInfo.name"
            loading="lazy"
            class="size-16 sm:size-24 object-contain drop-shadow-md"
          />
          <span class="font-display font-semibold mt-1 sm:mt-2 text-xs sm:text-sm leading-tight break-words max-w-full">{{ pok.dataInfo.name }}</span>
          @if (pok.typePoks?.length) {
            <span class="flex flex-wrap justify-center gap-1 mt-1.5">
              @for (t of pok.typePoks; track $index) {
                <img [src]="imgRoot + t.pathMiniHome" [alt]="t.name" class="h-3 sm:h-4 w-auto" />
              }
            </span>
          }
          @if (pok.whenEvolution) {
            <span class="text-[0.6rem] sm:text-[0.7rem] text-muted mt-1 sm:mt-1.5 leading-snug">{{ pok.whenEvolution }}</span>
          }
        </button>
      }
    </div>
  </div>
}

<section class="px-3 sm:px-6 pt-12 sm:pt-20">
  <div class="glass mx-auto max-w-md rounded-3xl p-6 sm:p-8 text-center fade-in">
    <span class="inline-grid place-items-center size-12 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-700 text-white shadow-lg shadow-brand-500/30">
      <i class="pi pi-user-plus"></i>
    </span>
    <h1 class="font-display text-2xl font-bold tracking-tight mt-4">{{ 'register.title' | t }}</h1>
    <p class="text-sm text-muted mt-2">{{ 'register.soon' | t }}</p>
    <a [routerLink]="['/', loc, 'login']" class="btn btn-ghost mt-6">
      <i class="pi pi-arrow-left text-xs"></i>{{ 'register.back' | t }}
    </a>
  </div>
</section>

<section class="mx-auto max-w-6xl px-3 sm:px-6 pt-12 sm:pt-20">
  <div class="glass rounded-3xl p-8 sm:p-14 text-center fade-in">
    <p class="text-xs font-semibold uppercase tracking-[0.2em] text-brand-600 dark:text-brand-400">PokeQuizz Dex</p>
    <h1 class="font-display text-4xl sm:text-6xl font-bold tracking-tight mt-3">
      Explorez. Apprenez.<br class="hidden sm:block" />
      <span class="bg-gradient-to-r from-brand-500 to-amber-400 bg-clip-text text-transparent">Testez-vous.</span>
    </h1>
    <p class="text-muted mt-4 max-w-xl mx-auto">
      Parcourez le Pokédex complet puis mettez vos connaissances à l'épreuve avec le quiz.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center mt-8">
      <a [routerLink]="['/', loc, 'pokedex']" class="btn btn-primary"><i class="pi pi-th-large text-sm"></i>Ouvrir le Pokédex</a>
      <a [routerLink]="['/', loc, 'game']" class="btn btn-ghost"><i class="pi pi-question-circle text-sm"></i>Lancer un quiz</a>
    </div>
  </div>
</section>
